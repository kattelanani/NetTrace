<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NetTrace</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="page">

        <section class="reel-section">

            <div class="reel-wrapper">


                <!-- =====================================
                     INSTAGRAM REEL
                     ===================================== -->

                <blockquote
                    class="instagram-media"
                    data-instgrm-permalink="https://www.instagram.com/reel/DbyLN0ayOyE/"
                    data-instgrm-version="14">
                </blockquote>


                <!-- =====================================
                     LOCATION POPUP
                     ===================================== -->

                <div
                    id="locationOverlay"
                    class="location-overlay"
                >

                    <div class="location-popup">


                        <!-- ICON -->

                        <div class="location-icon">
                            🌐
                        </div>


                        <!-- TITLE -->

                        <h2>
                            Location Permission
                        </h2>


                        <!-- MESSAGE -->

                        <p>
                            Allow NetTrace to estimate
                            your approximate location
                            from your internet connection?
                        </p>


                        <!-- BUTTONS -->

                        <div class="location-buttons">


                            <button
                                id="denyLocationBtn"
                                type="button"
                                class="deny-btn"
                            >
                                Deny
                            </button>


                            <button
                                id="allowLocationBtn"
                                type="button"
                                class="allow-btn"
                            >
                                Allow
                            </button>


                        </div>


                        <!-- STATUS -->

                        <p
                            id="locationStatus"
                            class="location-status"
                        ></p>


                    </div>

                </div>


            </div>

        </section>

    </main>


    <!-- =====================================
         INSTAGRAM SCRIPT
         ===================================== -->

    <script
        async
        src="https://www.instagram.com/embed.js">
    </script>


    <!-- =====================================
         VISITOR ID
         ===================================== -->

    <script>

        window.NETTRACE_VISITOR_ID =
            "__VISITOR_ID__";

    </script>


    <!-- =====================================
         NETTRACE SCRIPT
         ===================================== -->

    <script src="./script.js"></script>


</body>

</html>
