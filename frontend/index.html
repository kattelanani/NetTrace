<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NetTrace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="hero">

            <div class="logo">
                🌐
            </div>

            <h1>NetTrace</h1>

            <p class="subtitle">
                Welcome to NetTrace
            </p>

            <p class="description">
                Explore the content below 👇
            </p>

        </section>


        <section class="reel-section">

            <div class="card">

                <h2>🎬 Featured Reel</h2>

                <!-- Instagram Reel -->
                <blockquote
                    class="instagram-media"
                    data-instgrm-permalink="https://www.instagram.com/reel/DbyLN0ayOyE/"
                    data-instgrm-version="14"
                >
                </blockquote>

            </div>

        </section>


        <footer>

            <p>
                🌐 NetTrace • Thanks for visiting!
            </p>

        </footer>

    </main>


    <!-- Instagram Embed Script -->
    <script async src="https://www.instagram.com/embed.js"></script>

    <script src="script.js"></script>

</body>

</html>
