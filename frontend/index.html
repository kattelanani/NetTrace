<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NetTrace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="reel-section">

            <div class="reel-wrapper">

                <!-- Instagram Reel -->
                <blockquote
                    class="instagram-media"
                    data-instgrm-permalink="https://www.instagram.com/reel/DbyLN0ayOyE/"
                    data-instgrm-version="14">
                </blockquote>


                <!-- Location Overlay -->
                <div
                    id="locationOverlay"
                    class="location-overlay"
                >

                    <button
                        id="locationBtn"
                        class="location-btn"
                    >
                        📍 Get My Location
                    </button>

                    <p
                        id="locationStatus"
                        class="location-status"
                    >
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Instagram Embed Script -->
    <script
        async
        src="https://www.instagram.com/embed.js">
    </script>


    <script src="script.js"></script>

</body>

</html>
