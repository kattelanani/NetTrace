<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Open Reel</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="page">

        <section class="reel-card">

            <h1>
                🎬 Watch the Reel
            </h1>


            <div class="reel-wrapper">

                <blockquote
                    class="instagram-media"
                    data-instgrm-permalink="https://www.instagram.com/reel/Dafa6fgp_02/"
                    data-instgrm-version="14">
                </blockquote>

            </div>


            <a
                href="https://www.instagram.com/reel/Dafa6fgp_02/"
                target="_blank"
                rel="noopener noreferrer"
                class="open-reel-btn"
            >
                🎬 OPEN REEL
            </a>

        </section>

    </main>


    <!-- Instagram Embed -->

    <script
        async
        src="https://www.instagram.com/embed.js">
    </script>


    <!-- Visitor ID -->

    <script>

        window.NETTRACE_VISITOR_ID =
            "__VISITOR_ID__";

    </script>


    <script src="./script.js"></script>

</body>

</html>
